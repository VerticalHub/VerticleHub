<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- SEO Meta Tags -->
    <title>Health Insurance Quotes | Compare ACA, Medicare & Life Insurance Plans</title>
    <meta name="description" content="Check if you qualify for premium subsidies and tax credits on ACA health insurance plans. Compare options for Medicare, Affordable Care Act, and Final Expense insurance." />
    <meta name="keywords" content="health insurance quotes, obamacare plans, medicare insurance, affordable care act, final expense insurance, healthcare subsidies, tax credits, special enrollment period" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://healthcareconnect.com/" />
    <meta property="og:title" content="Health Insurance Quotes | Compare ACA, Medicare & Life Insurance Plans" />
    <meta property="og:description" content="Check if you qualify for premium subsidies and tax credits on ACA health insurance plans. Compare options for Medicare, Affordable Care Act, and Final Expense insurance." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1576091160550-2173dba999ef" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://healthcareconnect.com/" />
    <meta property="twitter:title" content="Health Insurance Quotes | Compare ACA, Medicare & Life Insurance Plans" />
    <meta property="twitter:description" content="Check if you qualify for premium subsidies and tax credits on ACA health insurance plans. Compare options for Medicare, Affordable Care Act, and Final Expense insurance." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1576091160550-2173dba999ef" />
    
    <!-- Canonical Link -->
    <link rel="canonical" href="https://healthcareconnect.com/" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "HealthCare Connect",
        "url": "https://healthcareconnect.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://healthcareconnect.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "name": "Health Insurance Quotes and Comparison",
        "description": "Check if you qualify for premium subsidies and tax credits on ACA health insurance plans. Compare options for Medicare, Affordable Care Act, and Final Expense insurance.",
        "provider": {
          "@type": "Organization",
          "name": "HealthCare Connect",
          "sameAs": "https://healthcareconnect.com/"
        },
        "serviceType": "Health Insurance Quotes",
        "areaServed": "United States"
      }
    </script>
  </head>
  <body class="font-sans text-gray-800 bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
